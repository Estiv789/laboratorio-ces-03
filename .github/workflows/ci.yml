name: Integracion continua Java
on:
  push:
    branches: [main, feature-transferencia, feature-bloqueo-saldo-insuficiente]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Construccion y pruebas unitarias
        run: mvn -B clean test
